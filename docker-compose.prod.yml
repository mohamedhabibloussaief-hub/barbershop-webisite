# ════════════════════════════════════════════════════════════════
#  Hazem Coiff — Production overrides
#  Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
#  Before deploying:
#    1. Set DJANGO_SETTINGS_MODULE=config.settings.prod in .env
#    2. Set DEBUG=False
#    3. Set ALLOWED_HOSTS=yourdomain.tn
#    4. Set a strong SECRET_KEY
#    5. Upload SSL cert/key to /etc/ssl/hazemcoiff/
# ════════════════════════════════════════════════════════════════
services:

  db:
    # Never expose DB port in production
    ports: []
    # Stronger restart policy in prod
    restart: always

  backend:
    build:
      context: ./backend
      target: runtime
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    # No source mount — code is baked into image
    volumes:
      - backend_static:/app/staticfiles
    # No direct port exposure — only Nginx talks to backend
    ports: []
    restart: always
    command: >
      sh -c "
        python manage.py migrate --noinput &&
        python manage.py collectstatic --noinput --clear -v 0 &&
        gunicorn config.wsgi:application
          --bind 0.0.0.0:8000
          --workers 3
          --threads 2
          --timeout 60
          --access-logfile -
          --error-logfile -
          --log-level info
      "

  frontend:
    build:
      context: ./frontend
      target: prod
    # No dev server in prod — Nginx serves the built dist/
    ports: []
    volumes: []
    restart: always

  nginx:
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - backend_static:/usr/share/nginx/html/static:ro
      - frontend_dist:/usr/share/nginx/html:ro
      - /etc/ssl/hazemcoiff:/etc/ssl/hazemcoiff:ro
    ports:
      - "80:80"
      - "443:443"
    restart: always

volumes:
  frontend_dist:
