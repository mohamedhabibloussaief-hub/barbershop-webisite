# ════════════════════════════════════════════════════════════════
#  Hazem Coiff — Development stack
#  Usage: docker-compose up --build
#
#  Ports exposed to host:
#    80    → Nginx  (main entry point — use this for everything)
#    8000  → Django (direct access for Postman / API testing)
#    5432  → PostgreSQL (DBeaver / pgAdmin)
# ════════════════════════════════════════════════════════════════
services:

  # ── PostgreSQL 16 ─────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: hazemcoiff_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME}
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  # ── Django backend ────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      target: runtime
    container_name: hazemcoiff_backend
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
    volumes:
      # Hot-reload: source mounted so runserver picks up changes
      - ./backend:/app
      # Prevent host node_modules / __pycache__ from leaking in
      - backend_static:/app/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
        echo '→ Running migrations…' &&
        python manage.py migrate --noinput &&
        echo '→ Collecting static files…' &&
        python manage.py collectstatic --noinput --clear -v 0 &&
        echo '→ Starting development server…' &&
        python manage.py runserver 0.0.0.0:8000
      "
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8000/api/health/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── React frontend (Vite dev server) ──────────────────────────
  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: hazemcoiff_frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - VITE_APP_NAME=Hazem Coiff
      - VITE_API_URL=http://backend:8000
    command: npm run dev -- --host 0.0.0.0

  # ── Nginx reverse proxy ───────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: hazemcoiff_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - backend_static:/usr/share/nginx/html/static:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  backend_static:
  frontend_modules:
