# ════════════════════════════════════════════════════════════════
#  Hazem Coiff — Nginx production config
#  Requirements before using:
#    - SSL cert at /etc/ssl/hazemcoiff/fullchain.pem
#    - SSL key at /etc/ssl/hazemcoiff/privkey.pem
#    - Replace "hazemcoiff.tn" with your actual domain
# ════════════════════════════════════════════════════════════════

# Force HTTP → HTTPS
server {
    listen 80;
    server_name hazemcoiff.tn www.hazemcoiff.tn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name hazemcoiff.tn www.hazemcoiff.tn;

    # ── SSL ───────────────────────────────────────────────────
    ssl_certificate     /etc/ssl/hazemcoiff/fullchain.pem;
    ssl_certificate_key /etc/ssl/hazemcoiff/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Security headers ──────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options           "DENY"                                          always;
    add_header X-Content-Type-Options    "nosniff"                                       always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"               always;
    add_header Permissions-Policy        "geolocation=(), microphone=()"                 always;

    # ── Gzip ──────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1024;

    # ── Django API ────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        client_max_body_size 10m;
    }

    # ── Django admin ──────────────────────────────────────────
    location /admin/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }

    # ── Django static files ───────────────────────────────────
    location /static/ {
        alias   /usr/share/nginx/html/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # ── React SPA ─────────────────────────────────────────────
    root /usr/share/nginx/html;
    location / {
        # Fingerprinted assets get long cache
        location ~* \.(js|css|woff2?|ttf|otf|eot|svg|ico|png|jpg|webp)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        try_files $uri /index.html;
    }
}
