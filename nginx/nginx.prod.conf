# ════════════════════════════════════════════════════════════════
#  Hazem Coiff — Nginx development config
#  Routing:
#    /api/*    → Django backend container (port 8000)
#    /admin/*  → Django admin
#    /static/* → Collected static files
#    /*        → Vite dev server (HMR + WebSocket)
# ════════════════════════════════════════════════════════════════

server {
    listen 80;
    server_name localhost;

    # ── Django API ────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # ── Django admin ──────────────────────────────────────────
    location /admin/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Django static files ───────────────────────────────────
    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # ── Vite dev server (React + HMR) ─────────────────────────
    # When running with docker-compose, frontend container is "frontend"
    location / {
        proxy_pass         http://frontend:5173;
        proxy_http_version 1.1;
        # HMR requires WebSocket upgrade
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_cache_bypass $http_upgrade;
    }

    # ── Vite HMR WebSocket endpoint ───────────────────────────
    location /@vite/ {
        proxy_pass         http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
    }
}
